# Advisories that reach this project only through its dependencies, with no fix it can take, each with the reason it
# does not harm the app. Read by osv-scanner and the OpenSSF Scorecard; cargo-deny keeps its own list in deny.toml, and
# docs/SECURITY.md explains each. An entry goes once a fixed version can be taken: `ignoreUntil` makes it be looked at
# again.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
ignoreUntil = 2027-05-01
reason = "rsa, inside Proton's pgp crates: the Marvin timing attack needs many measured decryptions; the app decrypts locally and shows no timing to anyone"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
ignoreUntil = 2027-05-01
reason = "crypto-bigint through cx448 in Proton's crates: timing that an attacker would have to measure on this computer"

