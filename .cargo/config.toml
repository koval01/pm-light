# Proton publishes its crypto crates here; their workspace refers to this registry by name.
[registries]
proton = { index = "sparse+https://rust-registry.proton.me/index/" }

# Release builds target a concrete baseline, so the compiler may use newer instructions.
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]
