# Two more eyes on vulnerabilities, each another engine than the checks before them, both writing to the repository's
# Security tab. OSV-Scanner reads every lockfile against OSV, which joins RustSec with GitHub's advisories and more:
# cargo-deny knows RustSec alone, and some advisories reach GitHub first. Advisories that cannot be fixed here are
# listed with their reasons in osv-scanner.toml, and a new one fails the run. Semgrep reads the code and the workflows
# with its rules for Rust, for security audits, for secrets and for GitHub Actions, beside CodeQL's.
name: Vulnerabilities

on:
  push:
    branches: [main]
  pull_request:
  # OSV every four hours, and Semgrep, whose rules change less often than advisories, once a day at the first.
  schedule:
    - cron: "17 4 * * *"
    - cron: "17 0,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulnerabilities-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  osv:
    name: Dependencies (OSV-Scanner)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1

  semgrep:
    name: Code and workflows (Semgrep)
    if: github.event_name != 'schedule' || github.event.schedule == '17 4 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What CodeQL reads, by .github/codeql/codeql-config.yml: not the vendored crates, which are another project's
      # code, and not the tests, whose keys, passwords and temporary folders are fixed on purpose. The components list
      # is generated.
      - name: Scan
        run: |
          semgrep scan --metrics=off --sarif --output semgrep.sarif \
            --config p/rust --config p/security-audit --config p/secrets --config p/github-actions \
            --exclude vendor --exclude app/components \
            --exclude 'tests.rs' --exclude '*_tests.rs' --exclude 'app/tests' --exclude 'core/src/test_server.rs' \
            --exclude '*.asc' --exclude '*.pem' --exclude 'test_vectors.json'
      # A finding marked in the code, `// nosemgrep: <rule>` under the reason why it is safe on purpose, still comes in
      # the SARIF, flagged as suppressed in source, and GitHub opened an alert for it all the same. Only those go
      # before the upload, and the run says how many: every rule still runs, and anything unmarked is an alert.
      - name: Leave out what is marked in the code
        run: |
          python3 - <<'EOF'
          import json
          with open("semgrep.sarif", encoding="utf-8") as source:
              sarif = json.load(source)
          for run in sarif["runs"]:
              kept = [result for result in run["results"] if not result.get("suppressions")]
              print(f"{len(run['results']) - len(kept)} findings marked in the code left out, {len(kept)} kept")
              run["results"] = kept
          with open("semgrep.sarif", "w", encoding="utf-8") as target:
              json.dump(sarif, target)
          EOF
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: ${{ !cancelled() }}
        with:
          sarif_file: semgrep.sarif
          category: semgrep
