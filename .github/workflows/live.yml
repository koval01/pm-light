# The account check: the app opens the test account on every system with the session its owner handed over
# (scripts/live-session.sh), reads it, and draws its first mail through the system's web engine. Then it walks the
# window through its mail, folders, letters, settings pages, sizes, looks, zooms and languages, and the screen is
# photographed at each (app/src/screen_tour.rs, scripts/photograph-tour.sh). It never refreshes the tokens, sends
# nothing and saves nothing; the mail it opened is marked unread again where it was.
#
# Started by hand only, and only from main: the environment `live-account`, the only place the session is, takes no
# other branch. The three systems run at once, so an approval, if the environment asks for one, is given once for
# all. The log carries numbers and fixed words only. The artifacts show the test account's mail and the screens: the
# account holds nothing of worth, and its owner wants them seen. Nothing of the session is in either.
name: Live account

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-account
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    name: Account on ${{ matrix.os }}
    environment: live-account
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1-dev libdbus-1-dev xvfb \
            gnome-keyring dbus-x11 imagemagick

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --locked -p proton-mail-light --bins --examples

      - name: Read the account
        env:
          LIVE_SESSION: ${{ secrets.LIVE_SESSION }}
        run: cargo run --locked -q -p proton-mail-light --example live_check

      - name: Open it in the app (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        env:
          LIVE_SESSION: ${{ secrets.LIVE_SESSION }}
          PML_JOURNAL_ECHO: "1"
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # A keychain item answers only the program that made it, and the app's question for the login keychain's
            # password, which no one here knows, held up the check. So the session goes into a keychain of the run's
            # own, with a password made for it, and its partition list lets the unsigned app read it. The machine is
            # thrown away after the run.
            keychain="$RUNNER_TEMP/live.keychain-db"
            password=$(openssl rand -hex 24)
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            # shellcheck disable=SC2046 # the list of keychains is split on purpose
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            security default-keychain -d user -s "$keychain"
            security add-generic-password -U -A -s org.koval-dev.proton-mail-light -a session -w "$LIVE_SESSION" "$keychain"
            cdhash=$(codesign -dvvv target/debug/proton-mail-light 2>&1 | sed -n 's/^CDHash=//p' | head -n 1)
            security set-generic-password-partition-list -S "apple-tool:,apple:,unsigned:${cdhash:+,cdhash:$cdhash}" \
              -s org.koval-dev.proton-mail-light -a session -k "$password" "$keychain" > /dev/null
            unset password
            echo "the session is in a keychain of the run's own"
          else
            cargo run --locked -q -p proton-mail-light --example seed_session
          fi
          unset LIVE_SESSION
          app=target/debug/proton-mail-light
          note="$PWD/target/debug/account"
          if [ "$RUNNER_OS" = Windows ]; then
            # The runner opens Edge by itself at times, in front of everything: counted, then closed.
            echo "Edge processes before the app: $(powershell -NoProfile -Command '(Get-Process msedge -ErrorAction SilentlyContinue | Measure-Object).Count')"
          fi
          "$app" "--check-account=$note" > target/debug/account.log 2>&1 &
          for _ in $(seq 1 150); do [ -f "$note.txt" ] && break; sleep 1; done
          if [ "$RUNNER_OS" = Windows ]; then
            echo "Edge processes once the mail was drawn: $(powershell -NoProfile -Command '(Get-Process msedge -ErrorAction SilentlyContinue | Measure-Object).Count')"
            powershell -NoProfile -Command 'Stop-Process -Name msedge -Force -ErrorAction SilentlyContinue'
          fi
          # shellcheck disable=SC2016 # PowerShell's own variables
          edge_parents() {
            # The program that started each Edge: this app, or the system. Names of programs only.
            powershell -NoProfile -Command '$p = Get-CimInstance Win32_Process; $p | Where-Object Name -eq "msedge.exe" | ForEach-Object { $id = $_.ParentProcessId; ($p | Where-Object ProcessId -eq $id).Name } | Sort-Object | Get-Unique -AsString'
          }
          if ! grep -qx "failed" "$note.txt" 2>/dev/null; then
            scripts/photograph-tour.sh "$note" target/debug/screens
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            echo "Edge started by: $(edge_parents | tr '\r\n' '  ')"
          fi
          grep -E "account check|mail picture|screen tour|session|link|earlier page|WARN|ERROR|The error was|Details:" target/debug/account.log | cut -c1-200 || true
          kill %1 2>/dev/null || true
          test -f "$note.txt" || { echo "No report of the account check"; exit 1; }
          cat "$note.txt"
          ! grep -qx "failed" "$note.txt"

      - name: Open it in the app (Linux)
        if: runner.os == 'Linux'
        env:
          LIVE_SESSION: ${{ secrets.LIVE_SESSION }}
          PML_JOURNAL_ECHO: "1"
          # X errors reported where they happen, with the request that caused them, instead of later and unnamed.
          GDK_SYNCHRONIZE: "1"
        run: |
          # shellcheck disable=SC2016 # expanded by the inner shell, inside its own D-Bus session
          dbus-run-session -- bash -c '
            set -e
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo run --locked -q -p proton-mail-light --example seed_session
            unset LIVE_SESSION
            note="$PWD/target/debug/account"
            # A screen of its own, with no access control, so that the photographer can reach it as the app does.
            Xvfb :99 -screen 0 1440x900x24 -nolisten tcp > /dev/null 2>&1 &
            export DISPLAY=:99
            sleep 1
            target/debug/proton-mail-light "--check-account=$note" > target/debug/account.log 2>&1 &
            for _ in $(seq 1 150); do [ -f "$note.txt" ] && break; sleep 1; done
            if ! grep -qx "failed" "$note.txt" 2>/dev/null; then
              scripts/photograph-tour.sh "$note" target/debug/screens
            fi
            grep -E "account check|mail picture|screen tour|session|link|earlier page|WARN|ERROR|The error was|Details:" target/debug/account.log | cut -c1-200 || true
            kill %1 2>/dev/null || true
            test -f "$note.txt" || { echo "No report of the account check"; exit 1; }
            cat "$note.txt"
            ! grep -qx "failed" "$note.txt"'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: account-${{ runner.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/debug/account.png
            target/debug/account.txt
            target/debug/screens/*.png
