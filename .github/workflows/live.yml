# The account check: the app opens the test account on every system with the session its owner handed over
# (scripts/live-session.sh), reads it, and draws its first mail through the system's web engine. It never refreshes
# the tokens, sends nothing, and changes nothing but the read mark of that one mail.
#
# Started by hand only, and every run waits for the owner's approval in the environment `live-account`, the only
# place the session is. The log carries numbers and fixed words only. The artifacts show the test account's first
# mail, open in the window and as the web engine drew it: the account holds nothing of worth, and its owner wants
# them seen. Nothing of the session is in either.
name: Live account

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-account
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    name: Account on ${{ matrix.os }}
    environment: live-account
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1-dev libdbus-1-dev xvfb \
            gnome-keyring dbus-x11

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --locked -p proton-mail-light --bins --examples

      - name: Read the account
        env:
          LIVE_SESSION: ${{ secrets.LIVE_SESSION }}
        run: cargo run --locked -q -p proton-mail-light --example live_check

      - name: Open it in the app (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        env:
          LIVE_SESSION: ${{ secrets.LIVE_SESSION }}
          PML_JOURNAL_ECHO: "1"
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # A keychain item answers only the program that made it unless told otherwise, and here no one could
            # answer the question the app would raise: any program on this machine, which is thrown away, may read it.
            security add-generic-password -U -A -s org.koval-dev.proton-mail-light -a session -w "$LIVE_SESSION"
            echo "the session is in the keychain"
          else
            cargo run --locked -q -p proton-mail-light --example seed_session
          fi
          unset LIVE_SESSION
          app=target/debug/proton-mail-light
          note="$PWD/target/debug/account"
          "$app" "--check-account=$note" > target/debug/account.log 2>&1 &
          for _ in $(seq 1 150); do [ -f "$note.txt" ] && break; sleep 1; done
          sleep 4
          if [ "$RUNNER_OS" = macOS ]; then
            screencapture -x target/debug/account-window.png
          else
            powershell -NoProfile -Command "Add-Type -AssemblyName System.Windows.Forms, System.Drawing; \$s=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds; \$b=New-Object System.Drawing.Bitmap \$s.Width, \$s.Height; [System.Drawing.Graphics]::FromImage(\$b).CopyFromScreen(\$s.Location, [System.Drawing.Point]::Empty, \$s.Size); \$b.Save('target/debug/account-window.png')"
          fi
          grep -E "account check|mail picture|session|WARN|ERROR" target/debug/account.log | cut -c1-200 || true
          kill %1 2>/dev/null || true
          test -f "$note.txt" || { echo "No report of the account check"; exit 1; }
          cat "$note.txt"
          ! grep -qx "failed" "$note.txt"

      - name: Open it in the app (Linux)
        if: runner.os == 'Linux'
        env:
          LIVE_SESSION: ${{ secrets.LIVE_SESSION }}
          PML_JOURNAL_ECHO: "1"
          # X errors reported where they happen, with the request that caused them, instead of later and unnamed.
          GDK_SYNCHRONIZE: "1"
        run: |
          # shellcheck disable=SC2016 # expanded by the inner shell, inside its own D-Bus session
          dbus-run-session -- bash -c '
            set -e
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo run --locked -q -p proton-mail-light --example seed_session
            unset LIVE_SESSION
            note="$PWD/target/debug/account"
            xvfb-run -a -s "-screen 0 1440x900x24" target/debug/proton-mail-light "--check-account=$note" \
              > target/debug/account.log 2>&1 &
            for _ in $(seq 1 150); do [ -f "$note.txt" ] && break; sleep 1; done
            sleep 4
            import -display "$(ls /tmp/.X11-unix | sed -n "s/^X/:/p" | head -n 1)" -window root target/debug/account-window.png || true
            grep -E "account check|mail picture|session|WARN|ERROR" target/debug/account.log | cut -c1-200 || true
            kill %1 2>/dev/null || true
            test -f "$note.txt" || { echo "No report of the account check"; exit 1; }
            cat "$note.txt"
            ! grep -qx "failed" "$note.txt"'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: account-${{ runner.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/debug/account.png
            target/debug/account.txt
            target/debug/account-window.png
