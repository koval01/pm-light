# The long run: the app opens the test account and is driven at random for an hour, by its own actions and, on
# Linux, by real clicks and keys at random places of its window (app/src/soak.rs, scripts/random-clicks.sh). Then:
#
# - memory that keeps growing, a flood of requests, and the same request asked again within a second fail the run
#   (scripts/soak-report.py);
# - on Linux every connection of the app and of its webviews' processes is traced and its owner looked up: directly
#   only Proton, Quad9 and Gravatar when turned on, through Tor only Tor's relays, and no lookup on port 53 at all
#   (scripts/connections.py).
#
# - beside it, WebKitGTK alone is shown a link it may not follow, and pressed on it by a real pointer, to see what it
#   sends over the network (scripts/link-preconnect.py): a mail's links are no different.
#
# Nothing of the account changes: a check refuses every request but a read, and refuses what would wait on a person.
# Started by hand, and once a week. The logs and the report hold numbers, owners and paths without ids only.
name: Long run

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How long each system is driven
        default: "60"
  schedule:
    - cron: "7 1 * * 0"

permissions:
  contents: read

concurrency:
  group: long-run
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MINUTES: ${{ inputs.minutes || '60' }}

jobs:
  link:
    name: WebKitGTK and a link it may not follow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: WebKitGTK, its introspection and a virtual screen
        run: |
          sudo apt-get update
          sudo apt-get install -y gir1.2-webkit2-4.1 python3-gi xvfb xdotool strace
      - name: Hover, press and click
        run: |
          Xvfb :99 -screen 0 1024x768x24 -nolisten tcp > /dev/null 2>&1 &
          export DISPLAY=:99
          sleep 1
          for variant in hover press click click-self click-no-preconnect click-door; do
            # Every connection of WebKit's processes, with the name of the process making it, as in the long run.
            strace -f -qq -Y -s 0 -e trace=connect -o "trace-$variant.txt" \
              python3 -I scripts/link-preconnect.py "$variant" || echo "$variant: the script failed"
            grep -E 'sin_port=htons' "trace-$variant.txt" | grep -v 'htons(53)' | sed -E 's/^[0-9]+//; s/\(.*//' \
              | sort | uniq -c | sed "s/^/  $variant: connects by /" || true
          done

  linux:
    name: Linux, ${{ matrix.way }}, every connection traced
    environment: live-account
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        way: [direct, tor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux libraries and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1-dev libdbus-1-dev xvfb \
            gnome-keyring dbus-x11 strace xdotool imagemagick
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Build
        run: cargo build --locked -p proton-mail-light --bins --examples
      - name: Drive it
        env:
          LIVE_SESSION: ${{ secrets.LIVE_SESSION }}
          WAY: ${{ matrix.way }}
        run: |
          # shellcheck disable=SC2016 # expanded by the inner shell, inside its own D-Bus session
          dbus-run-session -- bash -c '
            set -e
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            scripts/seed-session.sh
            unset LIVE_SESSION
            note="$PWD/target/debug/account"
            Xvfb :99 -screen 0 1440x900x24 -nolisten tcp > /dev/null 2>&1 &
            export DISPLAY=:99
            sleep 1
            tor=""
            [ "$WAY" = tor ] && tor="--soak-tor"
            seed=$(date +%s)
            echo "seed $seed"
            # The link check: a port that counts what reaches it, which the only link of a made-up mail points at.
            python3 -I scripts/count-connections.py target/debug/link.port target/debug/link.count &
            for _ in $(seq 1 20); do [ -s target/debug/link.port ] && break; sleep 0.5; done
            link=$(cat target/debug/link.port)
            # Every connection, of the app and of every process it starts, with no data: -s 0. The app makes itself
            # unreadable to other processes (PR_SET_DUMPABLE, protection.rs), and a tracer of the same user then sees
            # only pointers where addresses stand: strace runs as root, and the app as this user (-u). getsockname
            # names the ports the app holds itself, such as its Tor door, which its own clients reach. A single -q keeps
            # how each process ended, and a signal that ended one: the app can say nothing of a crash itself.
            # -tt and -Y put the time of day and the name of the process on each call, to be read beside the
            # journal and the clicks.
            sudo -E strace -u "$USER" -f -q -tt -Y -s 0 -e trace=connect,sendto,sendmsg,getsockname \
              -o target/debug/connections.trace \
              env HOME="$HOME" target/debug/proton-mail-light "--check-account=$note" "--soak-minutes=$MINUTES" \
              "--soak-seed=$seed" "--soak-link-port=$link" $tor > target/debug/account.log 2>&1 &
            app=$!
            for _ in $(seq 1 600); do [ -f "$note.txt" ] && break; sleep 1; done
            if [ -f "$note.txt" ] && ! grep -qx "failed" "$note.txt"; then
              # The app shows the link and says where the body of the mail is; a real pointer presses it there.
              for _ in $(seq 1 120); do [ -s "$note.link" ] && break; sleep 1; done
              if [ -s "$note.link" ] && ! grep -qx nowhere "$note.link"; then
                read -r across down < "$note.link"
                window=$(xdotool search --onlyvisible --name "Proton Mail Light" | head -n 1)
                eval "$(xdotool getwindowgeometry --shell "$window")"
                # The screen as the pointer finds it, with the point it presses ringed, and the screen after.
                import -window root target/debug/link-before.png || true
                convert target/debug/link-before.png -fill none -stroke red -strokewidth 3 \
                  -draw "circle $((X + across)),$((Y + down)) $((X + across + 14)),$((Y + down))" \
                  target/debug/link-before.png || true
                xdotool mousemove $((X + across)) $((Y + down)) click 1
                echo "$(date -u +%H:%M:%S.%3N) the link check: pressed at $across by $down" >> target/debug/clicks.log
                sleep 5
                import -window root target/debug/link-after.png || true
                echo "link check: $(cat target/debug/link.count) connections reached the port of the link"
                grep -c "a link for the browser: refused" target/debug/account.log \
                  | sed "s/^/link check: links handed to the browser so far: /" || true
                touch "$note.link-done"
              else
                echo "::warning::the link check had nothing to press: see the journal"
                import -window root target/debug/link-before.png || true
                touch "$note.link-done"
              fi
              scripts/random-clicks.sh "$MINUTES" "$seed" target/debug/clicks.log &
              for _ in $(seq 1 $(((MINUTES + 15) * 60))); do
                [ -f "$note.done" ] && break
                ps -p "$app" > /dev/null || { echo "::error::the app ended before the run did"; break; }
                sleep 1
              done
            fi
            scripts/check-log.sh target/debug/account.log
            # A fatal signal to any process the app started, its own threads included, before the run stopped it.
            grep -E -- "--- SIG(SEGV|ABRT|BUS|ILL|FPE|SYS|TRAP) |\+\+\+ killed by" target/debug/connections.trace \
              | tail -n 5 || true
            echo "trace: $(wc -l < target/debug/connections.trace 2>/dev/null || echo no) lines, $(grep -c "connect(" target/debug/connections.trace 2>/dev/null || echo 0) connects"
            # The app runs as this user, and strace, which started it, as root. Only a command line that starts with
            # the program is the app: this script and strace name it too, further on, and a looser pattern ends them.
            pkill -f "^target/debug/proton-mail-light " || true
            sudo kill "$app" 2>/dev/null || true
            wait "$app" 2>/dev/null || true
            test -f "$note.soak" || { echo "::error::no report of the long run"; cat "$note.txt" 2>/dev/null; exit 1; }
            # The page of the made-up mail was not laid out at its place (webviews::place_at).
            ! grep -q "the page is not laid out at its place" target/debug/account.log \
              || { echo "::error::the mail page is not laid out at its place"; exit 1; }
            # A clicked link reached the network: WebKit connected to it on its own (app/src/nowhere.rs).
            [ "$(cat target/debug/link.count 2>/dev/null || echo 0)" = 0 ] \
              || { echo "::error::a clicked link in a mail reached its address"; exit 1; }'
      - name: Memory and requests
        if: ${{ !cancelled() }}
        run: python3 -I scripts/soak-report.py target/debug/account.soak
      - name: Every connection
        if: ${{ !cancelled() }}
        env:
          WAY: ${{ matrix.way }}
        run: |
          python3 -I scripts/connections.py --self-test
          # The fallback directories of the arti that was built, which Tor asks first.
          version=$(grep -A1 '^name = "tor-dircommon"' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          fallbacks=$(find ~/.cargo/registry/src -path "*/tor-dircommon-$version/data/fallback_dirs.rs" | head -n 1)
          python3 -I scripts/connections.py target/debug/connections.trace --way "$WAY" --fallbacks "$fallbacks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: long-run-linux-${{ matrix.way }}
          if-no-files-found: warn
          retention-days: 14
          # The trace holds addresses, ports and the paths of local sockets, with no data (strace -s 0).
          path: |
            target/debug/account.soak
            target/debug/account.log
            target/debug/connections.trace
            target/debug/clicks.log
            target/debug/link-before.png
            target/debug/link-after.png

  others:
    name: ${{ matrix.os }}, the app's own actions
    environment: live-account
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Build
        run: cargo build --locked -p proton-mail-light --bins --examples
      - name: Drive it
        shell: bash
        env:
          LIVE_SESSION: ${{ secrets.LIVE_SESSION }}
        run: |
          scripts/seed-session.sh
          unset LIVE_SESSION
          note="$PWD/target/debug/account"
          seed=$(date +%s)
          echo "seed $seed"
          pressure=()
          [ "$RUNNER_OS" = macOS ] && pressure=(--soak-pressure)
          target/debug/proton-mail-light "--check-account=$note" "--soak-minutes=$MINUTES" "--soak-seed=$seed" \
            "${pressure[@]}" > target/debug/account.log 2>&1 &
          app=$!
          for _ in $(seq 1 $(((MINUTES + 25) * 60))); do
            [ -f "$note.done" ] && break
            kill -0 "$app" 2>/dev/null || { echo "::error::the app ended before the run did"; break; }
            sleep 1
          done
          # On macOS the system then asks every process for memory back, as when memory runs short, without taking
          # any (memory_pressure -S); the app measures again, and the report tells a cache from what is held.
          if [ ${#pressure[@]} -gt 0 ] && [ -f "$note.done" ]; then
            sudo memory_pressure -S -l critical -s 20 > /dev/null || echo "::warning::no memory pressure"
            touch "$note.pressed"
            for _ in $(seq 1 60); do
              [ -f "$note.measured" ] && break
              sleep 1
            done
          fi
          scripts/check-log.sh target/debug/account.log
          kill "$app" 2>/dev/null || true
          test -f "$note.soak" || { echo "::error::no report of the long run"; cat "$note.txt" 2>/dev/null; exit 1; }
      - name: Memory and requests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          pressure=()
          [ "$RUNNER_OS" = macOS ] && pressure=(--pressure)
          python3 -I scripts/soak-report.py target/debug/account.soak "${pressure[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: long-run-${{ runner.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/debug/account.soak
            target/debug/account.log
