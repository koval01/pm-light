# Checked before every build by scripts/check.sh. Each exception says why it is one.

[graph]
all-features = false

[advisories]
# Known, with no fix available here. docs/SECURITY.md explains each.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa in Proton's pgp crates: a timing attack that needs measured local decryptions" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint through cx448 in Proton's crates, same reasoning" },
    { id = "RUSTSEC-2025-0144", reason = "ml-dsa signing timing, which an attacker would have to measure locally" },
    { id = "RUSTSEC-2026-0459", reason = "SQLite in arti's directory cache, which only the app writes; tor-dirmgr 0.48 holds rusqlite below the fix" },
]
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
# The project's own crates are not published, and have no license chosen yet.
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    # Public domain in all but name, OSI approved: async_executors, under arti.
    "Unlicense",
    "CDLA-Permissive-2.0",
    # Slint is used under its royalty-free license; see docs/ARCHITECTURE.md.
    "LicenseRef-Slint-Royalty-free-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# `path = "../core"` counts as a wildcard; it is the project's own crate.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/ProtonMail/proton-crypto-rs"]
