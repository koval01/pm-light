# Checked before every build by scripts/check.sh. Each exception says why it is one.

[graph]
all-features = false

[advisories]
# Known, with no fix available here. docs/SECURITY.md explains each.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa in Proton's pgp crates: a timing attack that needs measured local decryptions" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint through cx448 in Proton's crates, same reasoning" },
    { id = "RUSTSEC-2025-0144", reason = "ml-dsa signing timing, which an attacker would have to measure locally" },
    { id = "RUSTSEC-2026-0459", reason = "SQLite in arti's directory cache, which only the app writes; tor-dirmgr 0.48 holds rusqlite below the fix" },
]
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
# The project's own crates are not published, and have no license chosen yet.
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    # Public domain in all but name, OSI approved: async_executors, under arti.
    "Unlicense",
    "CDLA-Permissive-2.0",
    # Slint is used under its royalty-free license; see docs/ARCHITECTURE.md.
    "LicenseRef-Slint-Royalty-free-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# `path = "../core"` counts as a wildcard; it is the project's own crate.
allow-wildcard-paths = true

# Code that runs while the app is built is where a poisoned release strikes first, before any advisory names it.
# Only these crates may have a build script: one more, and the build stops until someone has read it. Nothing that
# runs at build time may carry a program or a script of its own.
[bans.build]
executables = "deny"
interpreted = "deny"
include-archives = true
allow-build-scripts = [
    "ahash", "android-activity", "ash", "async-io", "async_executors", "atk-sys", "bindgen", "borsh", "cairo-sys-rs",
    "chrono-tz", "clang-sys", "codepage-437", "cookie", "crc24", "crc32fast", "crossbeam-deque", "crossbeam-epoch",
    "crossbeam-utils", "crunchy", "curve25519-dalek", "defmt", "defmt-macros", "derive-deftly-macros", "drm-fourcc",
    "drm-sys", "encoding_rs", "field-offset", "figment", "gdk-pixbuf-sys", "gdk-sys", "gdkx11-sys", "generic-array",
    "getrandom", "gio", "gio-sys", "glib-sys", "glutin", "glutin-winit", "glutin_egl_sys", "glutin_glx_sys",
    "glutin_wgl_sys", "gobject-sys", "gopenpgp-sys", "gtk", "gtk-sys", "httparse", "i-slint-backend-linuxkms",
    "i-slint-backend-selector", "i-slint-backend-testing", "i-slint-backend-winit", "i-slint-compiler",
    "i-slint-renderer-skia", "iana-time-zone-haiku", "icu_decimal_data", "icu_locale_fallback_data",
    "icu_normalizer_data", "icu_plurals_data", "icu_properties_data", "icu_segmenter_data", "indexmap",
    "inotify-sys", "input-sys", "io-lifetimes", "javascriptcore-rs-sys", "jni", "jni-macros", "jni-sys",
    "khronos_api", "libc", "libdbus-sys", "liblzma-sys", "libm", "libmimalloc-sys", "libseat", "libseat-sys",
    "libsqlite3-sys", "libudev-sys", "libxdo-sys", "mac-notification-sys", "memoffset", "mime_guess", "naga", "nix",
    "ntapi", "num-bigint-dig", "num-traits", "objc-sys", "objc2", "objc2-exception-helper", "orbclient", "pango-sys",
    "parking_lot_core", "paste", "portable-atomic", "portable-atomic-util", "prettyplease", "proc-macro-error",
    "proc-macro-error-attr", "proc-macro2", "pulldown-cmark", "quinn", "quinn-udp", "quote", "radium", "rayon-core",
    "reed-solomon-erasure", "ref-cast", "rfd", "ring", "rspolib", "rustix", "rustls", "rustversion", "selectors",
